aid: panta
name: Panta
description: >-
  Panta is an AI-native commercial insurance brokerage that automates the
  operations layer of insurance placement. Rather than selling software to
  brokers, Panta operates as a licensed broker (all 50 states) whose AI
  operators handle submissions, follow-ups, service, and renewals across file
  systems, carrier portals, email, phone, and PDFs. It focuses on hard-to-place
  Excess & Surplus (E&S) and heavy-industry risk — construction and trades,
  transportation and logistics (trucking fleets, owner-operators, cargo),
  manufacturing, and hospitality — placing coverage across General Liability,
  Workers Compensation, Commercial Auto, Property, Cyber, Professional
  Liability, Umbrella/Excess, and Employment Practices Liability through an
  A-rated carrier panel. Surfaced as a Y Combinator portfolio company. Panta
  publishes no public API or developer platform.
